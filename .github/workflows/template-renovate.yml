name: Validate Renovate configuration

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate-renovate:
    name: Validate Renovate configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Validate Renovate configuration
        run: npx --yes --package renovate@44.190.1 renovate-config-validator --strict --no-global renovate.json
