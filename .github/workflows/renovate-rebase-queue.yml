name: Renovate rebase queue

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    # Branch updates are handled when their CI completes, not once per PR edit/label change.
    types: [closed, ready_for_review, converted_to_draft, auto_merge_enabled, auto_merge_disabled]
  workflow_run:
    # Explicit names prevent queue, publication, and cleanup completions from starting another run.
    # GitHub's default CodeQL setup names its PR runs "PR #<number>".
    workflows: ['Test PHP images with extensions', 'CodeQL', 'PR #*']
    branches: ['renovate/**', 'refs/pull/*/head']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: renovate-rebase-queue
  cancel-in-progress: false
  # Reconciliation reads live state, so retain only the latest pending event.

jobs:
  reconcile:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.user.login == 'renovate[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.action != 'closed' || github.event.pull_request.merged != true)) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.path == '.github/workflows/build-test.yml' ||
        github.event.workflow_run.path == 'dynamic/github-code-scanning/codeql'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This workflow has write permissions. Never execute PR code or artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile the single active rebase request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/renovate_rebase_queue.py --repository "$GITHUB_REPOSITORY" --summary "$GITHUB_STEP_SUMMARY"
