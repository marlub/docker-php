name: Renovate rebase queue

on:
  push:
    branches: [main]
  workflow_run:
    # "Validate build outcome" is the final aggregate job in this parent workflow.
    # Successful completions also matter if main advanced while this PR was testing.
    workflows: ['Test PHP images with extensions']
    branches: ['renovate/**']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: renovate-rebase-queue
  cancel-in-progress: false
  # Reconciliation reads live state, so retain only the latest pending event.

jobs:
  reconcile:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.path == '.github/workflows/build-test.yml')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This workflow has write permissions. Never execute PR code or artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile the single active rebase request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/renovate_rebase_queue.py --repository "$GITHUB_REPOSITORY" --summary "$GITHUB_STEP_SUMMARY"
