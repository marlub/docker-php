name: Build, test, and publish a PHP base family

on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
      registry:
        required: true
        type: string
      image:
        required: true
        type: string
      cache-image:
        description: Registry image used only for build caches
        required: true
        type: string
      merged-prs:
        description: JSON array of trusted merged PR numbers to import on main
        default: '[]'
        type: string
      variants:
        required: true
        type: string
      source-ref:
        required: true
        type: string
      no-cache:
        description: Recompile even when matching build layers are cached
        default: false
        type: boolean

defaults:
  run:
    shell: bash

env:
  BUILDX_BAKE_DISABLE_VARS_ENV_LOOKUP: '1'
  IMAGE: ${{ inputs.registry }}/${{ inputs.image }}

jobs:
  build-and-test:
    name: ${{ fromJson(inputs.variants)[0].base_target }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source-ref }}
      # A new builder per job keeps forced builds isolated from older compiler records.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        id: builder
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # main
        if: inputs.publish
        with:
          release: v0.11.7
      - name: Build and test selected family variants
        uses: ./.github/actions/build-group
        with:
          variants: ${{ inputs.variants }}
          builder: ${{ steps.builder.outputs.name }}
          arch: ${{ matrix.arch }}
          source-ref: ${{ inputs.source-ref }}
          publish: ${{ inputs.publish }}
          registry: ${{ inputs.registry }}
          image: ${{ inputs.image }}
          cache-image: ${{ inputs.cache-image }}
          merged-prs: ${{ inputs.merged-prs }}
          no-cache: ${{ inputs.no-cache }}
          token: ${{ github.token }}

  publish:
    name: Publish ${{ matrix.variant.tagMinor }}
    needs: build-and-test
    if: ${{ !cancelled() && inputs.publish }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(inputs.variants) }}
    env:
      ENTRY: ${{ toJson(matrix.variant) }}
      TAG_MINOR: ${{ matrix.variant.tagMinor }}
      TAG_PATCH: ${{ matrix.variant.tagPatch }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-results-${{ matrix.variant.base_target }}-amd64-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-results/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-results-${{ matrix.variant.base_target }}-arm64-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-results/arm64
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Require successful candidates from this attempt
        env:
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 scripts/build_group.py extract --entry "$ENTRY" --attempt "$ATTEMPT" \
            --bundles "$RUNNER_TEMP/build-results" --out "$RUNNER_TEMP/digests"
      - name: Verify candidate metadata
        run: |
          for arch in amd64 arm64; do
            digest=$(cat "$RUNNER_TEMP/digests/$arch.digest")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image}}' |
              python3 tests/verify_image.py --metadata --entry "$ENTRY" --platform "linux/$arch"
          done
      - name: Check current main
        id: current
        run: python3 scripts/plan_ci.py --check-current "$ENTRY" --github-output "$GITHUB_OUTPUT"
      - name: Publish and verify tags
        if: steps.current.outputs.superseded == 'false'
        run: |
          amd64=$(cat "$RUNNER_TEMP/digests/amd64.digest")
          arm64=$(cat "$RUNNER_TEMP/digests/arm64.digest")
          docker buildx imagetools create --tag "$IMAGE:$TAG_MINOR" --tag "$IMAGE:$TAG_PATCH" "$IMAGE@$amd64" "$IMAGE@$arm64"
          indexes=()
          for tag in "$TAG_MINOR" "$TAG_PATCH"; do
            manifest=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}')
            jq -e --arg amd64 "$amd64" --arg arm64 "$arm64" '
              [.manifests[] | {platform: (.platform.os + "/" + .platform.architecture), digest}] | sort_by(.platform) ==
              [{platform: "linux/amd64", digest: $amd64}, {platform: "linux/arm64", digest: $arm64}]
            ' <<< "$manifest" > /dev/null
            indexes+=("$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$manifest")")
          done
          test "${indexes[0]}" = "${indexes[1]}"
      - name: Publication summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          SUPERSEDED: ${{ steps.current.outputs.superseded }}
        run: |
          if [ "$STATUS" != success ]; then result=Failed
          elif [ "$SUPERSEDED" = true ]; then result=Superseded
          else result=Published; fi
          printf '| Variant | Result |\n| --- | --- |\n| %s | %s |\n' "$TAG_MINOR" "$result" >> "$GITHUB_STEP_SUMMARY"
