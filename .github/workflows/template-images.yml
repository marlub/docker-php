name: Template for images

on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
      registry:
        required: true
        type: string
      image:
        required: true
        type: string
      matrix:
        required: true
        type: string
      source-ref:
        required: true
        type: string

jobs:
  build-and-test:
    name: ${{ matrix.phpimage.tagMinor }} (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-latest' || matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        phpimage: ${{ fromJson(inputs.matrix).phpimages }}
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          no-cache: true
          target: ${{ matrix.phpimage.node != '' && 'php-node' || 'php' }}

          labels: ${{ matrix.phpimage.build_labels }}
          build-args: |
            PHP_BASE_IMAGE=${{ matrix.phpimage.resolved.php_images[matrix.platform] }}
            NODE_BASE_IMAGE=${{ matrix.phpimage.resolved.node_images[matrix.platform] }}
            INSTALLER_URL=${{ matrix.phpimage.resolved.installer_url }}
            INSTALLER_SHA256=${{ matrix.phpimage.resolved.installer_sha256 }}
            COMPOSER_VERSION=${{ matrix.phpimage.resolved.composer_version }}
            EXTENSIONS_INSTALL=${{ matrix.phpimage.resolved.extensions_install }}
            PECL_INSTALL=${{ matrix.phpimage.resolved.pecl_install }}
            EXTENSIONS=${{ matrix.phpimage.extensions }}
            PECL=${{ matrix.phpimage.pecl }}
            PACKAGES=${{ matrix.phpimage.packages }}
            OS=${{ matrix.phpimage.os }}
            NODE_VERSION=${{ matrix.phpimage.node }}

          tags: test

      - name: Test build
        env:
          NODE: ${{ matrix.phpimage.node }}
          EXTENSIONS: ${{ matrix.phpimage.extensions }} ${{ matrix.phpimage.pecl }}
          BUILD_INPUTS: ${{ matrix.phpimage.build_inputs }}
          FINGERPRINT: ${{ matrix.phpimage.fingerprint }}
        run: |
          scripts/test_image.sh --node="$NODE" --extensions="$EXTENSIONS" --image=test
          python3 scripts/verify_image.py --image test --inputs "$BUILD_INPUTS" --fingerprint "$FINGERPRINT"

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push digest
        if: ${{ inputs.publish }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          target: ${{ matrix.phpimage.node != '' && 'php-node' || 'php' }}
          tags: ${{ inputs.registry }}/${{ inputs.image }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

          labels: ${{ matrix.phpimage.build_labels }}
          build-args: |
            PHP_BASE_IMAGE=${{ matrix.phpimage.resolved.php_images[matrix.platform] }}
            NODE_BASE_IMAGE=${{ matrix.phpimage.resolved.node_images[matrix.platform] }}
            INSTALLER_URL=${{ matrix.phpimage.resolved.installer_url }}
            INSTALLER_SHA256=${{ matrix.phpimage.resolved.installer_sha256 }}
            COMPOSER_VERSION=${{ matrix.phpimage.resolved.composer_version }}
            EXTENSIONS_INSTALL=${{ matrix.phpimage.resolved.extensions_install }}
            PECL_INSTALL=${{ matrix.phpimage.resolved.pecl_install }}
            EXTENSIONS=${{ matrix.phpimage.extensions }}
            PECL=${{ matrix.phpimage.pecl }}
            PACKAGES=${{ matrix.phpimage.packages }}
            OS=${{ matrix.phpimage.os }}
            NODE_VERSION=${{ matrix.phpimage.node }}

      - name: Export digest
        if: ${{ inputs.publish }}
        env:
          PLATFORM: ${{ matrix.platform }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG_MINOR: ${{ matrix.phpimage.tagMinor }}
          TAG_PATCH: ${{ matrix.phpimage.tagPatch }}
          FINGERPRINT: ${{ matrix.phpimage.fingerprint }}
          BUILD_INPUTS: ${{ matrix.phpimage.build_inputs }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests/$TAG_MINOR"
          jq -c -n \
            --arg platform "$PLATFORM" \
            --arg digest "$DIGEST" \
            --arg tagMinor "$TAG_MINOR" \
            --arg tagPatch "$TAG_PATCH" \
            --arg fingerprint "$FINGERPRINT" \
            --arg build_inputs "$BUILD_INPUTS" \
            '$ARGS.named' > "$RUNNER_TEMP/digests/$TAG_MINOR/${{ strategy.job-index }}.json"

      - name: Upload digest
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
