name: Build, test, and publish one variant

on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
      registry:
        required: true
        type: string
      image:
        required: true
        type: string
      variant:
        required: true
        type: string
      source-ref:
        required: true
        type: string

defaults:
  run:
    shell: bash

env:
  ENTRY: ${{ inputs.variant }}
  IMAGE: ${{ inputs.registry }}/${{ inputs.image }}
  TAG_MINOR: ${{ fromJson(inputs.variant).tagMinor }}
  TAG_PATCH: ${{ fromJson(inputs.variant).tagPatch }}

jobs:
  build-and-test:
    name: ${{ fromJson(inputs.variant).tagMinor }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source-ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build once for local testing and later transfer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          target: ${{ fromJson(inputs.variant).node != '' && 'php-node' || 'php' }}
          no-cache: true
          provenance: false
          outputs: |
            type=docker
            type=oci,dest=${{ runner.temp }}/image.tar
          tags: test
          add-hosts: pecl.php.net:127.0.0.1
          labels: |
            io.github.marlub.docker-php.variant=${{ fromJson(inputs.variant).tagMinor }}
            org.opencontainers.image.revision=${{ inputs.source-ref }}
          build-args: |
            PHP_BASE_IMAGE=${{ fromJson(inputs.variant).php_image }}
            NODE_BASE_IMAGE=${{ fromJson(inputs.variant).node_image }}
            EXTENSIONS=${{ fromJson(inputs.variant).extensions }}
            PACKAGES=${{ fromJson(inputs.variant).packages }}
      - name: Test built image
        env:
          NODE: ${{ fromJson(inputs.variant).node }}
          EXTENSIONS: ${{ fromJson(inputs.variant).extensions }}
        run: |
          docker run --rm --entrypoint php -v "$PWD:/work:ro" test /work/tests/test_apk_lock.php
          docker run --rm --entrypoint sh -v "$PWD:/work:ro" test /work/tests/test_installer.sh
          scripts/test_image.sh --node="$NODE" --extensions="$EXTENSIONS" --image=test
          python3 scripts/verify_image.py --image test --entry "$ENTRY"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: inputs.publish
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # main
        if: inputs.publish
        with:
          release: v0.11.7
      - name: Upload the tested image by digest
        if: inputs.publish
        run: |
          mkdir -p "$RUNNER_TEMP/oci"
          tar -xf "$RUNNER_TEMP/image.tar" -C "$RUNNER_TEMP/oci"
          digest=$(jq -er '.manifests | if length == 1 then .[0].digest else error("Ambiguous candidate") end' "$RUNNER_TEMP/oci/index.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          config=$(jq -er '.config.digest' "$RUNNER_TEMP/oci/blobs/sha256/${digest#sha256:}")
          test "$config" = "$(docker image inspect test --format '{{.Id}}')"
          regctl image copy "ocidir://$RUNNER_TEMP/oci@$digest" "$IMAGE@$digest"
          printf '%s\n' "$digest" > "$RUNNER_TEMP/${{ matrix.arch }}.digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.publish
        with:
          name: digests-${{ fromJson(inputs.variant).tagMinor }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.arch }}.digest
          overwrite: true
          retention-days: 1

  publish:
    name: Publish ${{ fromJson(inputs.variant).tagMinor }}
    needs: build-and-test
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: digests-${{ fromJson(inputs.variant).tagMinor }}-amd64
          path: ${{ runner.temp }}/digests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: digests-${{ fromJson(inputs.variant).tagMinor }}-arm64
          path: ${{ runner.temp }}/digests
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Verify candidate metadata
        run: |
          for arch in amd64 arm64; do
            digest=$(cat "$RUNNER_TEMP/digests/$arch.digest")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image}}' |
              python3 scripts/verify_image.py --metadata --entry "$ENTRY" --platform "linux/$arch"
          done
      - name: Check current main
        id: current
        run: python3 scripts/plan_ci.py --check-current "$ENTRY" --github-output "$GITHUB_OUTPUT"
      - name: Publish and verify tags
        if: steps.current.outputs.superseded == 'false'
        run: |
          amd64=$(cat "$RUNNER_TEMP/digests/amd64.digest")
          arm64=$(cat "$RUNNER_TEMP/digests/arm64.digest")
          docker buildx imagetools create --tag "$IMAGE:$TAG_MINOR" --tag "$IMAGE:$TAG_PATCH" "$IMAGE@$amd64" "$IMAGE@$arm64"
          indexes=()
          for tag in "$TAG_MINOR" "$TAG_PATCH"; do
            manifest=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}')
            jq -e --arg amd64 "$amd64" --arg arm64 "$arm64" '
              [.manifests[] | {platform: (.platform.os + "/" + .platform.architecture), digest}] | sort_by(.platform) ==
              [{platform: "linux/amd64", digest: $amd64}, {platform: "linux/arm64", digest: $arm64}]
            ' <<< "$manifest" > /dev/null
            indexes+=("$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$manifest")")
          done
          test "${indexes[0]}" = "${indexes[1]}"
      - name: Publication summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          SUPERSEDED: ${{ steps.current.outputs.superseded }}
        run: |
          if [ "$STATUS" != success ]; then result=Failed
          elif [ "$SUPERSEDED" = true ]; then result=Superseded
          else result=Published; fi
          printf '| Variant | Result |\n| --- | --- |\n| %s | %s |\n' "$TAG_MINOR" "$result" >> "$GITHUB_STEP_SUMMARY"
