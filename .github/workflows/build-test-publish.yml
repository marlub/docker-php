name: Build & publish PHP images with extensions

on:
  workflow_dispatch:
    inputs:
      php:
        description: PHP minor to rebuild
        type: choice
        default: All
        options: ['All', '8.2', '8.3', '8.4', '8.5']
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - build/**
      - scripts/**
      - tests/**
      - .github/workflows/**

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-php-images
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ghcr.io
  IMAGE: marlub/php

jobs:
  select-variants:
    name: Select affected variants
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_changes: ${{ steps.select.outputs.has_changes }}
      source_ref: ${{ steps.source.outputs.ref }}
    steps:
      - name: Restrict manual publication to main
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Record build source
        id: source
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Select affected variants
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.before }}
          PHP_MINOR: ${{ inputs.php }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python scripts/select_images.py --php "$PHP_MINOR" --out "$RUNNER_TEMP/matrix.json" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          else
            python scripts/select_images.py --base-ref "$BASE_REF" --out "$RUNNER_TEMP/matrix.json" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          fi

  build-and-test:
    name: ${{ matrix.phpimage.tagMinor }}
    needs: select-variants
    if: needs.select-variants.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        phpimage: ${{ fromJson(needs.select-variants.outputs.matrix).phpimages }}
    uses: ./.github/workflows/template-images.yml
    with:
      publish: true
      registry: ghcr.io
      image: marlub/php
      variant: ${{ toJson(matrix.phpimage) }}
      source-ref: ${{ needs.select-variants.outputs.source_ref }}
