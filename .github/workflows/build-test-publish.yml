name: Build & publish PHP images with extensions

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild all variants, including unchanged dependencies
        required: false
        default: false
        type: boolean
  schedule:
   - cron: "0 0 * * *"

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE: marlub/php

concurrency:
  group: publish-php-images
  cancel-in-progress: false

jobs:
  update-matrix:
    name: Update matrix
    runs-on: ubuntu-latest
    
    outputs:
      registry: ${{ steps.prepare_build_vars.outputs.registry }}
      image: ${{ steps.prepare_build_vars.outputs.image }}
      matrix: ${{ steps.select.outputs.matrix }}
      has_changes: ${{ steps.select.outputs.has_changes }}
      source_ref: ${{ steps.prepare_build_vars.outputs.source_ref }}

    steps:
      - name: Authenticate as GH Action Admin
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.GH_ACTIONS_ADMIN_APP_ID }}
          private-key: ${{ secrets.GH_ACTIONS_ADMIN_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests packaging

      - name: Update matrix.json
        run: |
          python scripts/update_matrix.py

      - name: Commit matrix.json if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@example.com"

          if ! git diff --quiet matrix.json; then
            git add matrix.json
            git commit -m "Update matrix.json [auto]"
            git push
          fi

      - name: Prepare build variables
        id: prepare_build_vars
        run: |
          printf 'registry=%s\nimage=%s\nsource_ref=%s\n' \
            "$REGISTRY" "$IMAGE" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select changed variants
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          extra=()
          if [ "$FORCE" = "true" ]; then
            extra+=(--select-all)
          fi
          python scripts/select_images.py \
            --out "$RUNNER_TEMP/selected-images.json" \
            --image "$REGISTRY/$IMAGE" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" "${extra[@]}"

      - name: Upload selected matrix
        if: steps.select.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: selected-images
          path: ${{ runner.temp }}/selected-images.json
          if-no-files-found: error
          retention-days: 1

  build-and-test:
    name: Build and test
    needs: update-matrix
    if: needs.update-matrix.outputs.has_changes == 'true'
    uses: ./.github/workflows/template-images.yml
    with:
      publish: true
      registry: ${{ needs.update-matrix.outputs.registry }}
      image: ${{ needs.update-matrix.outputs.image }}
      matrix: ${{ needs.update-matrix.outputs.matrix }}
      source-ref: ${{ needs.update-matrix.outputs.source_ref }}

  publish-manifest:
    name: Publish image tags
    runs-on: ubuntu-latest
    needs:
      - update-matrix
      - build-and-test
    if: ${{ !cancelled() && needs.update-matrix.result == 'success' && needs.update-matrix.outputs.has_changes == 'true' }}
    steps:
      - name: Checkout build source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.update-matrix.outputs.source_ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download selected matrix
        uses: actions/download-artifact@v8
        with:
          name: selected-images
          path: ${{ runner.temp }}/selection

      - name: Download digests
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest from digests
        run: |
          python scripts/publish_images.py \
            --matrix "$RUNNER_TEMP/selection/selected-images.json" \
            --digests "$RUNNER_TEMP/digests" \
            --image "$REGISTRY/$IMAGE" \
            --summary "$GITHUB_STEP_SUMMARY"
