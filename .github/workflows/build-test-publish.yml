name: Build & publish PHP images with extensions

on:
  workflow_dispatch:
    inputs:
      php:
        description: PHP minor to rebuild
        type: choice
        default: All
        options: ['All', '8.2', '8.3', '8.4', '8.5']
      no-cache:
        description: Recompile all extensions without the build cache
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - README.md
      - LICENSE
      - .github/workflows/cache-cleanup.yml
      - scripts/cleanup_registry_cache.py
      - renovate.json
      - .github/workflows/template-renovate.yml
      - tests/**
      - scripts/plan_ci.py
      - scripts/image_config.py
      - scripts/refresh_apk_locks.py
      - .github/workflows/build-test.yml

permissions:
  contents: read

concurrency:
  group: publish-php-images
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ghcr.io
  IMAGE: marlub/php

jobs:
  select-variants:
    name: Plan publication
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
      source_ref: ${{ steps.source.outputs.ref }}
      merged-prs: ${{ steps.merged-prs.outputs.merged-prs || '[]' }}
    steps:
      - name: Restrict manual publication to main
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Record build source
        id: source
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Plan publication
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.before }}
          PHP_MINOR: ${{ inputs.php }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python scripts/plan_ci.py --php "$PHP_MINOR" --out "$RUNNER_TEMP/matrix.json" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          else
            python scripts/plan_ci.py --purpose publish --base-ref "$BASE_REF" --out "$RUNNER_TEMP/matrix.json" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          fi
      - name: Find merged PR cache sources
        id: merged-prs
        if: steps.plan.outputs.has_changes == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
          BASE_REF: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--repository "$GITHUB_REPOSITORY" --source-ref "$SOURCE_REF"
                --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY")
          if [ "$EVENT_NAME" = push ]; then args+=(--base-ref "$BASE_REF"); fi
          python scripts/find_merged_pr_caches.py "${args[@]}"

  build-and-test:
    name: ${{ matrix.phpimage.tagMinor }}
    permissions:
      contents: read
      packages: write
    needs: select-variants
    if: needs.select-variants.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        phpimage: ${{ fromJson(needs.select-variants.outputs.matrix).phpimages }}
    uses: ./.github/workflows/template-images.yml
    with:
      publish: true
      no-cache: ${{ inputs.no-cache || false }}
      registry: ghcr.io
      image: marlub/php
      cache-image: ghcr.io/marlub/php-buildcache
      merged-prs: ${{ needs.select-variants.outputs.merged-prs }}
      variant: ${{ toJson(matrix.phpimage) }}
      source-ref: ${{ needs.select-variants.outputs.source_ref }}
