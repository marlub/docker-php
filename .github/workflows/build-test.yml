name: Test PHP images with extensions

on:
  pull_request:
    paths-ignore:
      - docs/**
      - README.md
      - LICENSE

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  read-matrix:
    name: Plan CI jobs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
      renovate_changes: ${{ steps.plan.outputs.renovate_changes }}
      source_ref: ${{ steps.source.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Validate configuration and publication logic
        run: python -m unittest discover -s tests -v
      - name: Record build source
        id: source
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Plan CI jobs
        id: plan
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: python scripts/plan_ci.py --base-ref "$BASE_REF" --out "$RUNNER_TEMP/matrix.json" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  validate-renovate:
    needs: read-matrix
    if: needs.read-matrix.outputs.renovate_changes == 'true'
    uses: ./.github/workflows/template-renovate.yml

  build-and-test:
    name: ${{ matrix.phpimage.tagMinor }}
    needs: read-matrix
    if: needs.read-matrix.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        phpimage: ${{ fromJson(needs.read-matrix.outputs.matrix).phpimages }}
    uses: ./.github/workflows/template-images.yml
    with:
      publish: false
      registry: ''
      image: ''
      variant: ${{ toJson(matrix.phpimage) }}
      source-ref: ${{ needs.read-matrix.outputs.source_ref }}

  validate-build-and-test:
    name: Validate build outcome
    runs-on: ubuntu-latest
    needs: [read-matrix, build-and-test, validate-renovate]
    if: always()
    steps:
      - name: Require successful checks or an intentional empty selection
        env:
          CHECK_RESULT: ${{ needs.read-matrix.result }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          HAS_CHANGES: ${{ needs.read-matrix.outputs.has_changes }}
          RENOVATE_RESULT: ${{ needs.validate-renovate.result }}
          RENOVATE_CHANGES: ${{ needs.read-matrix.outputs.renovate_changes }}
        run: |
          test "$CHECK_RESULT" = success
          if [ "$HAS_CHANGES" = true ]; then
            test "$BUILD_RESULT" = success
          else
            test "$HAS_CHANGES" = false
            test "$BUILD_RESULT" = skipped
          fi
          if [ "$RENOVATE_CHANGES" = true ]; then
            test "$RENOVATE_RESULT" = success
          else
            test "$RENOVATE_CHANGES" = false
            test "$RENOVATE_RESULT" = skipped
          fi
