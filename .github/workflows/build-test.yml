name: Test PHP images with extensions

on:
  pull_request:

permissions:
  contents: read

jobs:
  read-matrix:
    name: Read matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare_build_vars.outputs.matrix }}
      source_ref: ${{ steps.source.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record build source
        id: source
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Test dependency selection and publication
        run: python -m unittest discover -s tests -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve all build variants
        id: prepare_build_vars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/select_images.py --select-all \
            --out "$RUNNER_TEMP/selected-images.json" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  build-and-test:
    name: Build and test
    needs: read-matrix
    uses: ./.github/workflows/template-images.yml
    with:
      publish: false
      registry: ''
      image: ''
      matrix: ${{ needs.read-matrix.outputs.matrix }}
      source-ref: ${{ needs.read-matrix.outputs.source_ref }}

  validate-build-and-test:
    name: Validate build outcome
    runs-on: ubuntu-latest
    needs: [read-matrix, build-and-test]
    if: ${{ cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') }}
    steps:
      - name: Conditionally fail required check
        run: |
          echo "::error Some required job has failed!"
          exit 1
