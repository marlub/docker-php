name: Test PHP images with extensions

on:
  pull_request:

permissions:
  contents: read

jobs:
  read-matrix:
    name: Select affected variants
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_changes: ${{ steps.select.outputs.has_changes }}
      source_ref: ${{ steps.source.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Validate configuration and publication logic
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Validate Renovate configuration
        run: npx --yes --package renovate@44.181.0 renovate-config-validator --strict
      - name: Record build source
        id: source
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Select affected variants
        id: select
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: python scripts/select_images.py --base-ref "$BASE_REF" --out "$RUNNER_TEMP/matrix.json" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  build-and-test:
    name: ${{ matrix.phpimage.tagMinor }}
    needs: read-matrix
    if: needs.read-matrix.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        phpimage: ${{ fromJson(needs.read-matrix.outputs.matrix).phpimages }}
    uses: ./.github/workflows/template-images.yml
    with:
      publish: false
      registry: ''
      image: ''
      variant: ${{ toJson(matrix.phpimage) }}
      source-ref: ${{ needs.read-matrix.outputs.source_ref }}

  validate-build-and-test:
    name: Validate build outcome
    runs-on: ubuntu-latest
    needs: [read-matrix, build-and-test]
    if: always()
    steps:
      - name: Require successful checks or an intentional empty selection
        env:
          CHECK_RESULT: ${{ needs.read-matrix.result }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          HAS_CHANGES: ${{ needs.read-matrix.outputs.has_changes }}
        run: |
          test "$CHECK_RESULT" = success
          if [ "$HAS_CHANGES" = true ]; then
            test "$BUILD_RESULT" = success
          else
            test "$HAS_CHANGES" = false
            test "$BUILD_RESULT" = skipped
          fi
